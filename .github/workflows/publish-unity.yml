name: Publish Unity

on:
  push:
    tags:
      - 'unity/v*'
  workflow_call:
    inputs:
      version:
        description: 'Package version (e.g., 1.9.0.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 1.9.0.0)'
        required: true
      force:
        description: 'Force overwrite existing release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-native:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rid: win-x64
            lib: zenoh_ffi.dll
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            rid: win-arm64
            lib: zenoh_ffi.dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rid: linux-x64
            lib: libzenoh_ffi.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            rid: linux-arm64
            lib: libzenoh_ffi.so
          - os: macos-latest
            target: x86_64-apple-darwin
            rid: osx-x64
            lib: libzenoh_ffi.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            rid: osx-arm64
            lib: libzenoh_ffi.dylib
          - os: macos-latest
            target: aarch64-apple-ios
            rid: ios-arm64
            lib: libzenoh_ffi.a

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        working-directory: native/zenoh-ffi
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: native/zenoh-ffi/target/${{ matrix.target }}/release/${{ matrix.lib }}

  publish:
    name: Publish
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: native/output

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=unity/v${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=unity/v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/unity/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=unity/v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create tag (if manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.tag }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            git tag -f "$TAG"
            git push origin "$TAG" --force
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # --- Assemble UPM package ---
      - name: Assemble UPM package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          UPM_VERSION="$(./scripts/upm-version.sh "$VERSION")"
          UNITY_PKG="src/ZenohDotNet.Unity/Assets/Plugins/com.zenohdotnet.unity"

          # Place native binaries + generate .meta files
          chmod +x scripts/generate-unity-meta.sh scripts/bundle-upm-native-source.sh
          ./scripts/generate-unity-meta.sh "$UNITY_PKG" "native/output" "native"
          ./scripts/bundle-upm-native-source.sh "$UNITY_PKG"

          # Update version in package.json (UPM SemVer, not NuGet four-segment)
          jq --arg v "$UPM_VERSION" '.version = $v' "$UNITY_PKG/package.json" > tmp.json
          mv tmp.json "$UNITY_PKG/package.json"

          echo "=== UPM package contents ==="
          find "$UNITY_PKG" -type f | sort

      - name: Package UPM tgz
        run: |
          mkdir -p packages
          cd src/ZenohDotNet.Unity/Assets/Plugins/com.zenohdotnet.unity
          tar -czf ../../../../../packages/com.zenohdotnet.unity.tgz .

      - name: Upload UPM package
        uses: actions/upload-artifact@v7
        with:
          name: unity-packages
          path: packages/*.tgz

      - name: Delete existing release (if force)
        if: github.event.inputs.force == 'true'
        run: gh release delete "${{ steps.version.outputs.tag }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Unity ${{ steps.version.outputs.version }}
          files: packages/*.tgz
          generate_release_notes: true

      - name: Push upm branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          UNITY_PKG="src/ZenohDotNet.Unity/Assets/Plugins/com.zenohdotnet.unity"

          cd "$UNITY_PKG"
          git init -b upm
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Release $VERSION"

          git push -f origin upm
          git tag "upm/v$VERSION"
          git push origin "upm/v$VERSION" --force
