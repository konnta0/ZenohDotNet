[package]
name = "zenoh_ffi"
version = "0.1.0"
edition = "2021"
authors = ["konnta0"]
license = "MIT"
description = "Zenoh C FFI bindings for C#"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "zenoh_ffi"

[dependencies]
zenoh = { version = "=1.10.2", features = ["unstable"] }
tokio = { version = "1.41", features = ["full"] }
serde_json = "1.0"
libc = "0.2"
once_cell = "1.19"
# 0.23.46 changes handshake behavior and crashes ZenohDotNet on Windows.
# Upstream accepts any 0.23.x; keep the ring provider Zenoh already selects.
rustls = { version = "=0.23.45", default-features = false, features = ["logging", "ring", "std", "tls12"] }

[build-dependencies]
csbindgen = "1.9"
cmake = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
